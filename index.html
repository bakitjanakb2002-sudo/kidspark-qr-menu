function renderCart(){const box=$('#cartLines');box.innerHTML='';let subtotal=0;for(const [id,l] of state.cart){subtotal+=l.qty*l.item.price;const r=document.createElement('div');r.className='cartLine';r.innerHTML=`<div><b>${escapeHtml(itemName(l.item))}</b><br><small>${money(l.item.price)}</small></div><div class="qty"><button data-q="-1">−</button><b>${l.qty}</b><button data-q="1">+</button></div>`;r.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{l.qty+=Number(b.dataset.q);if(l.qty<=0)state.cart.delete(id);syncCart()});box.appendChild(r)}if(!state.cart.size)box.innerHTML='<div class="empty">'+t('Себет бос','Корзина пуста')+'</div>';const fee=Math.round(subtotal*.10);$('#subtotal').textContent=money(subtotal);$('#fee').textContent=money(fee);$('#total').textContent=money(subtotal+fee)}
function sendWaiter(){const table=$('#tableNo').value.trim();if(!table){toast(t('Үстел нөмірін енгізіңіз','Введите номер стола'));return}const msg=t(`Сәлеметсіз бе! Kids Park, ${table}-үстелге официант керек.`,`Здравствуйте! Kids Park, нужен официант к столу №${table}.`);location.href='https://wa.me/'+CONTACT.whatsapp+'?text='+encodeURIComponent(msg)}
function sendOrder(){if(!state.cart.size)return;let subtotal=0;const lines=[];for(const l of state.cart.values()){subtotal+=l.qty*l.item.price;lines.push(`${itemName(l.item)} × ${l.qty} — ${money(l.qty*l.item.price)}`)}const fee=Math.round(subtotal*.10),total=subtotal+fee;const msg=t(`Kids Park тапсырыс:\n${lines.join('\n')}\n\nҚызмет 10%: ${money(fee)}\nЖалпы: ${money(total)}`,`Заказ Kids Park:\n${lines.join('\n')}\n\nОбслуживание 10%: ${money(fee)}\nИтого: ${money(total)}`);location.href='https://wa.me/'+CONTACT.whatsapp+'?text='+encodeURIComponent(msg)}
function renderAll(){renderTexts();renderMenu();syncCart()}

/* Photo-focused admin. Public menu never depends on this endpoint. */
async function adminApi(body){const r=await fetch(SUPA.admin,{method:'POST',headers:{'content-type':'application/json','x-admin-key':state.adminKey},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch(_){ }if(r.status===401)throw new Error('unauthorized');if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
async function adminLogin(){state.adminKey=$('#adminCode').value.trim();if(!state.adminKey)return;const st=$('#adminLogin .status');st.textContent='Connecting…';try{await adminApi({action:'ping'});$('#adminLogin').classList.add('hidden');$('#adminPanel').classList.remove('hidden');$('#adminStatus').textContent=t('✅ Admin сервері қосылды','✅ Admin-сервер подключен');renderAdminList()}catch(e){state.adminKey='';st.textContent=t('❌ Код қате немесе Admin сервері қолжетімсіз.','❌ Неверный код или Admin-сервер недоступен.');st.className='status bad'}}
function renderAdminList(){const q=$('#adminSearch').value.trim().toLowerCase();const list=$('#adminList');list.innerHTML='';for(const x of baseItems(state.adminType)){if(q&&!((x.kk+' '+x.ru+' '+x.ckk+' '+x.cru).toLowerCase().includes(q)))continue;const r=document.createElement('div');r.className='adminItem';r.innerHTML=`<div><b>${escapeHtml(x.kk)}</b><br><small>ID ${x.id} · ${escapeHtml(x.ckk)} · ${money(x.price)}</small></div><div class="adminActions"><button>📷</button></div>`;r.querySelector('button').onclick=()=>openPhotoEditor(x);list.appendChild(r)}$('#adminFood').classList.toggle('on',state.adminType==='food');$('#adminBar').classList.toggle('on',state.adminType==='bar')}
function openPhotoEditor(x){$('#photoItemId').value=x.id;$('#photoItemName').textContent=x.kk+' / '+x.ru;$('#photoUrl').value=x.img||'';$('#photoFile').value='';$('#photoPreview').style.display='none';$('#photoEditor').classList.remove('hidden')}
function fileDataUrl(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)})}
async function savePhoto(){const id=Number($('#photoItemId').value);const x=baseItems(state.adminType).find(v=>v.id===id);if(!x)return;let url=$('#photoUrl').value.trim();const f=$('#photoFile').files[0];const st=$('#adminStatus');try{st.textContent=t('Фото жүктелуде…','Загрузка фото…');if(f){const up=await adminApi({action:'upload',dataUrl:await fileDataUrl(f)});url=up.url||url}await adminApi({action:'upsert',item:{id:x.id,kk:x.kk,ru:x.ru,ckk:x.ckk,cru:x.cru,price:x.price,desc_kk:x.descKk,desc_ru:x.descRu,img:url,active:x.active,menu_type:state.adminType}});st.textContent=t('✅ Фото сақталды. Public мәзір келесі ашылғанда жаңарады.','✅ Фото сохранено. Public-меню обновится при следующем открытии.');$('#photoEditor').classList.add('hidden');if(state.menuType===state.adminType)resetItems(state.menuType)}catch(e){st.textContent=t('❌ Фото сақталмады: ','❌ Фото не сохранено: ')+e.message;st.className='status bad'}}

let adminTaps=0,adminTimer;
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(!a)return;const act=a.dataset.action;if(act==='lang-kz')setLang('kk');else if(act==='lang-ru')setLang('ru');else if(act==='toggle-lang')setLang(state.lang==='ru'?'kk':'ru');else if(act==='food')openMenu('food');else if(act==='bar')openMenu('bar');else if(act==='combo')openMenu('food',true);else if(act==='home')goHome();else if(act==='agree'){sessionStorage.setItem('kp_service_ok','1');safeClose($('#serviceDlg'))}else if(act==='waiter')safeShow($('#waiterDlg'));else if(act==='close-waiter')safeClose($('#waiterDlg'));else if(act==='send-waiter')sendWaiter();else if(act==='cart')safeShow($('#cartDlg'));else if(act==='close-cart')safeClose($('#cartDlg'));else if(act==='clear-cart'){state.cart.clear();syncCart()}else if(act==='send-order')sendOrder();else if(act==='admin-tap'){adminTaps++;clearTimeout(adminTimer);adminTimer=setTimeout(()=>adminTaps=0,1800);if(adminTaps>=5){adminTaps=0;document.body.classList.add('admin-mode');safeShow($('#adminDlg'))}}else if(act==='admin')safeShow($('#adminDlg'));else if(act==='close-admin')safeClose($('#adminDlg'));else if(act==='admin-login')adminLogin();else if(act==='admin-food'){state.adminType='food';renderAdminList()}else if(act==='admin-bar'){state.adminType='bar';renderAdminList()}else if(act==='save-photo')savePhoto()});
$('#search').addEventListener('input',e=>{state.query=e.target.value;renderMenu()});$('#adminSearch').addEventListener('input',renderAdminList);$('#photoFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;$('#photoPreview').src=await fileDataUrl(f);$('#photoPreview').style.display='block'});

// deterministic smoke-test hooks, harmless in production.
const qs=new URLSearchParams(location.search);if(qs.get('admin')==='1')document.body.classList.add('admin-mode');setLang(qs.get('lang')==='ru'?'ru':state.lang);const test=qs.get('test');if(test==='food')openMenu('food');if(test==='bar')openMenu('bar');if(test==='combo')openMenu('food',true);if(qs.get('admin')==='1')setTimeout(()=>safeShow($('#adminDlg')),80);renderAll();
</script>
</body></html>
